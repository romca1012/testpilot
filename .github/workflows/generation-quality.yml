name: Generation quality — local browser
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Validate observations against a real local DOM
        run: python -m pytest -q -m conformance tests/test_generation_browser_evidence.py tests/test_contexte_navigateur_reel.py tests/test_vocabulaire_universel.py tests/test_accname.py tests/test_live_session_ws.py tests/test_login_recording_rejeu_reel.py tests/test_login_recording_e2e.py
