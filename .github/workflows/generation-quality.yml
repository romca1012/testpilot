name: Generation quality — local browser
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Validate observations against a real local DOM
        run: python -m pytest -q -m conformance tests/test_generation_browser_evidence.py
