name: Generation quality — local browser
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 2026-10-22 : 15 min ne suffisaient plus (installation de Chromium ~9 min + tests navigateur de l etape 5)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Validate observations against a real local DOM
        run: python -m pytest -q -m conformance tests/test_generation_browser_evidence.py tests/test_contexte_navigateur_reel.py tests/test_vocabulaire_universel.py tests/test_accname.py tests/test_live_session_ws.py tests/test_login_recording_rejeu_reel.py tests/test_login_recording_e2e.py tests/test_vh04_oracle_navigateur.py tests/test_vh04_garde_session.py tests/test_vh04_texte_exact.py tests/test_vh04_validation_et_negatif.py tests/test_etape_depliant.py tests/test_live_session_images_en_direct.py tests/test_nombre_affiche.py tests/test_oracle_element_designe.py tests/test_texte_apparu_falsifiable.py tests/test_ia_informee.py
