name: Banc de mesure (Odoo)

# Banc de mesure de la fiabilité du verdict (lot 04) : une instance Odoo de RÉFÉRENCE jetable, des défauts et des
# pannes injectés, les indicateurs I1 (faux PASSED) et I5 (blocage attribué) mesurés en mode `figé` — AUCUN appel
# LLM, donc aucun coût en CI. Le mode `génération` (I3, I4, I6) appelle un LLM : il n'est jamais lancé ici.
#
# Le job ÉCHOUE si I1 > 0 (un défaut injecté est jugé `passed`) ou si I5 < 100 % (une panne d'environnement n'est pas
# rapportée `blocked`) : c'est la garde qui empêche un lot suivant de dégrader la fiabilité du verdict sans qu'on le
# voie.
#
# Déclencheurs : chaque nuit, à la demande, et sur une PR qui touche le banc lui-même (sinon un banc cassé ne se
# verrait que la nuit suivante).
on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "banc/**"
      - "specs/banc/**"
      - "compose.banc.yml"
      - "scripts/banc_*"
      - "tests/test_navigation_menu_banc.py"
      - "behave_runtime/steps_library/_base_helpers.py"
      - ".github/workflows/banc.yml"

permissions:
  contents: read

jobs:
  banc:
    name: Banc — Odoo ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Une version en échec ne doit pas masquer le résultat des autres : elles sont documentées une à une.
      fail-fast: false
      matrix:
        version: ["16.0", "17.0", "18.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Installer TestPilot et les dépendances de développement
        run: python -m pip install -e ".[dev]"
      - name: Installer le navigateur Chromium (Playwright)
        run: python -m playwright install --with-deps chromium
      - name: Initialiser le banc (base de démo, modules, neutralisation, comptes)
        run: bash scripts/banc_init.sh "${{ matrix.version }}"
      - name: Tests Odoo du module de défauts injectés
        run: |
          CLE="ODOO_IMAGE_$(echo '${{ matrix.version }}' | tr . _)"
          export ODOO_IMAGE="$(grep -E "^${CLE}=" banc/images.env | cut -d= -f2-)"
          docker compose -f compose.banc.yml run --rm -T odoo odoo -d banc -u tp_bugs_injectes \
            --test-tags "/tp_bugs_injectes" --test-enable --stop-after-init --log-level=test 2>&1 | tee test_module.log
          # Odoo termine par « 0 failed, 0 error(s) of N tests » : toute autre ligne de bilan est un échec.
          grep -q " 0 failed, 0 error(s) of " test_module.log
      - name: Navigation par menu (F17) sur l'instance Community du banc
        env:
          BANC_REQUIS: "1"   # un banc absent fait ÉCHOUER l'étape au lieu de la skipper
        run: python -m pytest -m banc tests/test_navigation_menu_banc.py -v
      - name: Mesure (mode figé — I1, I2, I5)
        run: python scripts/banc_mesure.py --version "${{ matrix.version }}"
      - name: Publier la mesure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banc-${{ matrix.version }}
          path: |
            docs/mesures/banc-${{ matrix.version }}-*.md
            docs/mesures/banc-${{ matrix.version }}-*.json
            test_module.log
      - name: Journaux d'Odoo en cas d'échec
        if: failure()
        run: docker compose -f compose.banc.yml logs --tail 200 odoo
      - name: Arrêter et effacer le banc
        if: always()
        run: docker compose -f compose.banc.yml down -v
