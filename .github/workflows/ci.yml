name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Installer TestPilot et les dépendances de développement
        run: python -m pip install -e ".[dev]"
      - name: Exécuter la suite backend
        run: pytest -q
      - name: Auditer les dépendances Python connues
        run: |
          python -m pip install pip-audit
          python -m pip_audit

  postgres:
    name: Backend — runtime PostgreSQL réel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testpilot
          POSTGRES_PASSWORD: testpilot
          POSTGRES_DB: testpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Même variable des deux côtés (Alembic ET la suite) : la preuve porte sur EXACTEMENT la
      # base que le runtime utiliserait en production, pas une configuration parallèle qui
      # pourrait diverger sans que personne ne le remarque.
      TESTPILOT_DB_URL: postgresql+psycopg://testpilot:testpilot@localhost:5432/testpilot
      TESTPILOT_TEST_POSTGRES_URL: postgresql+psycopg://testpilot:testpilot@localhost:5432/testpilot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Installer TestPilot et les dépendances de développement
        run: python -m pip install -e ".[dev]"
      - name: Appliquer les migrations Alembic sur la base jetable du service
        run: alembic upgrade head
      - name: Exécuter la preuve du runtime PostgreSQL réel
        run: >-
          pytest -q tests/test_migration_sqlite_postgres.py tests/test_postgres_runtime.py
          tests/test_tables_avec_id_postgres.py -v

  frontend:
    name: Frontend — Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Auditer toutes les dépendances
        run: npm audit --audit-level=moderate
      - name: Exécuter les tests
        run: npm test
      - name: Vérifier les types
        run: npm run type-check
      - name: Construire le frontend de production
        run: npm run build
