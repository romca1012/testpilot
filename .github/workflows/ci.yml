name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Installer TestPilot et les dépendances de développement
        run: python -m pip install -e ".[dev]"
      - name: Exécuter la suite backend
        run: pytest -q

  frontend:
    name: Frontend — Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Exécuter les tests
        run: npm test
      - name: Vérifier les types
        run: npm run type-check
      - name: Construire le frontend de production
        run: npm run build
