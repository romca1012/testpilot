name: Conformité multi-application

# ⚠️ Suite SÉPARÉE de la CI principale (ci.yml), volontairement : elle ouvre un vrai navigateur
# contre de VRAIES applications publiques (SauceDemo, the-internet.herokuapp.com) — un besoin
# (navigateur installé, réseau sortant, tolérance à la lenteur/l'indisponibilité d'un tiers) que
# le job `pytest -q` de ci.yml n'a pas et ne doit pas hériter (voir pyproject.toml : le marker
# `conformance` est exclu par défaut de `pytest -q`).
#
# Deux déclencheurs :
# - à chaque changement de la bibliothèque de steps partagée : c'est PRÉCISÉMENT le code que
#   cette suite existe pour vérifier (bug réel 2026-09-14 : un step classé « générique » qui ne
#   marchait en fait que sur Odoo) — la détecter au moment du changement, pas six semaines après ;
# - chaque nuit, en tâche de fond : ces applications tierces peuvent changer leur DOM sans qu'aucun
#   commit ne bouge ici — un CRON attrape cette dérive.
on:
  push:
    branches: [master]
    paths:
      - "behave_runtime/steps_library/**"
      - "tests/test_conformite_connecteur_web.py"
      - "tests/test_garde_generique_sans_marqueur_odoo.py"
      - "tests/test_vocabulaire_universel.py"
      - "tests/fixtures/torture_app/**"
  schedule:
    - cron: "17 2 * * *"   # chaque nuit — horaire décalé pour ne pas concourir avec d'autres jobs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Conformité (SauceDemo + the-internet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Installer TestPilot et les dépendances de développement
        run: python -m pip install -e ".[dev]"
      - name: Installer le navigateur Chromium (Playwright)
        run: python -m playwright install --with-deps chromium
      - name: Rejouer la bibliothèque de steps générique contre de VRAIES applications
        run: pytest -m conformance -v
