# Relais du banc Odoo (étape 4, A71) : Odoo et son adresse de remise à zéro sur la MÊME origine — TestPilot n'accepte une
# adresse de remise à zéro que sur l'application du projet (`essai.adresse_de_remise_a_zero`).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8069;
    client_max_body_size 64m;
    proxy_read_timeout 600s;

    location = /__reset {
        proxy_pass http://remise:8070;
    }

    location /websocket {
        proxy_pass http://odoo:8069;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass http://odoo:8069;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
