<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion — étape 1</title>
</head>
<body>
<form id="etape1">
  <label>Identifiant <input type="text"></label>
  <button type="submit">Continuer</button>
</form>
<script>
  // Identifiant d'élément RÉGÉNÉRÉ à chaque chargement (fixture "torture", §1.3 du plan de
  // consolidation, 2026-09-15) : ni name, ni data-test, ni id stable — locate_field ne peut
  // réussir que par le libellé visible, le palier le plus proche d'un usage humain.
  document.querySelector('input').id = 'f-' + Math.random().toString(36).slice(2);
  document.getElementById('etape1').addEventListener('submit', function (e) {
    e.preventDefault();
    var valeur = document.querySelector('input').value;
    location.href = 'login2.html?u=' + encodeURIComponent(valeur);
  });
</script>
</body>
</html>
