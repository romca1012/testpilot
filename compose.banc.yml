# Banc de mesure de la fiabilité du verdict (lot 04) — instance Odoo de RÉFÉRENCE, jetable.
#
# ⚠️ Ne JAMAIS pointer ce banc sur une instance client, ni y installer une base réelle : les défauts du
# module `tp_bugs_injectes` sont faits pour se tromper. Images figées PAR DIGEST (banc/images.env) : une
# mise à jour silencieuse de `odoo:17.0` ne doit pas déplacer la mesure.
#
#   docker compose -f compose.banc.yml up -d db
#   scripts/banc_init.sh 17.0        (ou scripts/banc_init.ps1 17.0 sous Windows)
#   docker compose -f compose.banc.yml down -v      # repartir de zéro (volume jetable)
name: banc-odoo

services:
  db:
    image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - banc-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    # Le digest est choisi par `scripts/banc_init.*` selon la version (`banc/images.env`) ; défaut : 17.0.
    image: ${ODOO_IMAGE:-odoo@sha256:8779f8157ddcc37b84014c94646073f46fd4ad776b7a5d95fc3b0dc73a24a8fa}
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      # Port dédié, jamais exposé hors de la machine.
      - "127.0.0.1:${BANC_PORT:-18069}:8069"
    volumes:
      - ./banc/odoo_addons:/mnt/extra-addons:ro
      - banc-filestore:/var/lib/odoo
    command: ["odoo", "-d", "banc", "--db-filter=^banc$", "--no-database-list"]

volumes:
  banc-pg:
  banc-filestore:
