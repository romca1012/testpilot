[build-system]
# >=83.0.0 : corrige PYSEC-2026-3447 (pip-audit le signalait sur la version fournie par défaut
# par les runners CI — >=68 la laissait passer puisque c'est un plancher, pas un plafond).
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "testpilot"
version = "0.1.0"
description = "TestPilot — génération et exécution de tests fonctionnels pilotées par IA (Incrément 0)"
requires-python = ">=3.10"
dependencies = [
    # ⚠️ Plafonné à <2 depuis le 2026-09-11 : "anthropic>=0.40" sans plafond a laissé une image
    # reconstruite tirer la 1.2.0 (majeure) — qui retire `temperature`/`top_p`/`top_k` de la
    # signature de `messages.create()` — et planter en TypeError avant même l'appel réseau
    # (`src/testpilot/llm/adapter.py::_params_echantillonnage`). Borner évite qu'une prochaine
    # majeure ne recasse le même genre de chose en silence entre un `pip install` local et un
    # build Docker distant.
    "anthropic>=1.2,<2",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "behave>=1.2.6",
    "playwright>=1.40",
    "OdooRPC>=0.9",
    "pdfplumber>=0.11",
    # Import des spécifications Word (`spec_extract._docx`). La dépendance était utilisée sans
    # être déclarée : une installation propre réussissait, puis le premier .docx échouait.
    "python-docx>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # Requis par les routes FastAPI qui acceptent UploadFile/Form (import de spécification et
    # pièces jointes). Sans lui, Uvicorn ouvre le port mais l'application plante à l'import.
    "python-multipart>=0.0.9",
    # Chiffrement au repos du secret de connexion d'un projet (2026-07-24). Était déjà présent
    # en transitif ; déclaré explicitement parce qu'on en dépend désormais directement — une
    # dépendance qu'on utilise sans la déclarer disparaît le jour où son porteur disparaît.
    "cryptography>=42.0",
    # Fondation portable PostgreSQL (2026-08-28, phase 1/3 — voir docs/ARCHITECTURE.md §4).
    # `sqlalchemy` porte le modèle de schéma indépendant du moteur (`store/schema_sa.py`) ;
    # `alembic` porte les migrations générées depuis ce modèle. Les deux sont dans les
    # dépendances PRINCIPALES et non `dev` : elles serviront au RUNTIME après la bascule
    # (phase 3), pas seulement à générer des migrations en développement. Ce lot NE branche
    # ni l'un ni l'autre sur `db.py`/`repositories.py` — 100 % additif, voir la note de conception.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Pilote du runtime PostgreSQL (phase 3) — plus seulement une preuve de développement.
    "psycopg[binary]>=3.1",
    # Métriques HTTP et file de tâches au format Prometheus (`GET /metrics`).
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "black>=24.0", "httpx>=0.27"]

[project.scripts]
testpilot = "testpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
testpilot = [
    "store/schema.sql",
    "generation/prompts/*.md",
    "reporting/templates/*.j2",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
# `testpilot` vit sous `src/`, tandis que le harnais réellement exécuté par
# Behave reste à la racine dans `behave_runtime/`. Déclarer les deux ici rend
# `pytest` reproductible sans variable PYTHONPATH propre au poste ou à la CI.
pythonpath = ["src", "."]
testpaths = ["tests"]
# ⚠️ `conformance` est EXCLU par défaut : ces tests ouvrent un vrai navigateur contre de VRAIES
# applications publiques (SauceDemo, the-internet.herokuapp.com) — un besoin (navigateur installé,
# réseau sortant) que le job `pytest -q` de la CI n'a pas (voir ci.yml, aucun `playwright install`).
# Lancer explicitement `pytest -m conformance` (en local, ou depuis conformance.yml) les inclut —
# la valeur passée en ligne de commande remplace celle-ci, elle ne s'y ajoute pas.
addopts = "-m \"not conformance\""
markers = [
    "donnees_reelles: échappatoire explicite au garde-fou conftest.py qui interdit à un test de toucher le vrai data/ du poste — aucun test actuel n'en a besoin, à documenter s'il en naît un.",
    "sans_bouchon_auth: échappatoire explicite au bouchon d'authentification par défaut (conftest.py) — pour le seul test qui vérifie le 401 SANS AUCUNE session (test_comptes_utilisateurs.py).",
    "conformance: suite de conformité multi-application (2026-09-14) — vrai navigateur contre de VRAIES applications publiques, pour prouver que la bibliothèque de steps GÉNÉRIQUE marche au-delà d'une seule appli déjà corrigée. Exclue de `pytest -q` par défaut (voir addopts) ; lancée par conformance.yml.",
]
